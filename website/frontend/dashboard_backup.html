<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LordsBot - Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
        }

        header {
            height: 70px;
            background: #15151c;
            border-bottom: 1px solid #292932;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .user {
            color: #aaa;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .welcome {
            color: #999;
            margin-bottom: 35px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: #15151c;
            border: 1px solid #292932;
            border-radius: 14px;
            padding: 25px;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
        }

        .active {
            color: #66ff99;
        }

        .inactive {
            color: #ff7777;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #5865f2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">LordsBot</div>
    <div class="user" id="username">Yükleniyor...</div>
</header>

<div class="container">

    <h1>Kontrol Paneli</h1>

    <p class="welcome">
        LordsBot hesabınıza hoş geldiniz.
    </p>

    <div class="cards">

        <div class="card">
            <h2>Hesap</h2>

            <p>Kullanıcı adı</p>

            <div class="value" id="accountUsername">
                Yükleniyor...
            </div>
        </div>

        <div class="card">
            <h2>Lisans</h2>

            <p>Durum</p>

            <div class="value" id="licenseStatus">
                Kontrol ediliyor...
            </div>

            <p id="licenseExpiry" style="margin-top: 15px; color: #999;"></p>
        </div>

    </div>

    <button onclick="logout()">
        Çıkış Yap
    </button>

</div>

<script>

const API_URL = "http://127.0.0.1:8001";

const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "index.html";
}

async function loadDashboard() {

    try {

        const meResponse = await fetch(
            API_URL + "/api/auth/me",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        if (!meResponse.ok) {
            logout();
            return;
        }

        const user = await meResponse.json();

        document.getElementById("username").innerText =
            user.username;

        document.getElementById("accountUsername").innerText =
            user.username;


        const licenseResponse = await fetch(
            API_URL + "/api/licenses/my",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const license = await licenseResponse.json();

        const statusElement =
            document.getElementById("licenseStatus");

        const expiryElement =
            document.getElementById("licenseExpiry");


        if (!license.has_license) {

            statusElement.innerText =
                "Lisans bulunamadı";

            statusElement.className =
                "value inactive";

            return;
        }


        if (license.valid) {

            statusElement.innerText =
                "Aktif";

            statusElement.className =
                "value active";

            if (license.expires_at) {

                const date = new Date(
                    license.expires_at
                );

                expiryElement.innerText =
                    "Bitiş: " +
                    date.toLocaleString("tr-TR");
            }

        } else {

            statusElement.innerText =
                "Pasif / Süresi dolmuş";

            statusElement.className =
                "value inactive";

            if (license.expires_at) {

                const date = new Date(
                    license.expires_at
                );

                expiryElement.innerText =
                    "Bitiş: " +
                    date.toLocaleString("tr-TR");
            }
        }

    } catch (error) {

        console.error(error);

        document.getElementById("licenseStatus").innerText =
            "Sunucu bağlantı hatası";
    }
}


function logout() {

    localStorage.removeItem("access_token");
    localStorage.removeItem("username");
    localStorage.removeItem("is_admin");

    window.location.href = "index.html";
}


loadDashboard();

</script>

</body>
</html>
